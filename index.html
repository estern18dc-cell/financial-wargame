:root{

  --accent:#55652a; --brass:#8a6f1f; --good:#2f7a3a; --bad:#b03d28; --warn:#8a6f1f; --you:#55652a; --shadow:#7f8373; --spx:#a8862c; --onaccent:#f6f4ec;

  --display:"DIN Condensed","DIN Alternate","Avenir Next Condensed","Arial Narrow",Impact,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10130b; --panel:#181c13; --ink:#dfe2d0; --muted:#939a86; --line:#2c3124; --soft:#20251a;
  --accent:#a9bc62; --brass:#cfa84c; --good:#86c06a; --bad:#e0714f; --warn:#cfa84c; --you:#a9bc62; --shadow:#858c78; --spx:#cfa84c; --onaccent:#10130b; color-scheme:dark;

  --r-EXP:#86c06a; --r-LATE:#d1a94a; --r-CORR:#e39a3c; --r-BEAR:#e0714f; --r-RECOV:#6fa9cc; --r-STAG:#b48ac4; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.mono,.stat .k,.stat .v,.sup .k,.sup .v,.tag,nav button,th,td.n,.mc,.badge,.chip,.subtitle,.engine{font-family:var(--mono)}
header{padding-block:16px 0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1{font:700 34px/1 var(--display);margin:0 0 4px;letter-spacing:.2em;color:var(--accent)}
h2{font:700 16px/1.25 var(--display);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);letter-spacing:.1em;text-transform:uppercase}
h2 .muted{font:400 12px var(--sans);letter-spacing:0;text-transform:none}
h3{font:600 11px var(--mono);margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);font-size:12px}
.subtitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.engine{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:2px 6px}
nav{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 12px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
#simbar{height:2px;margin-top:-1px;position:relative;overflow:hidden}
#simbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--brass);opacity:0;transition:width .15s linear,opacity .3s}
#simbar.on i{opacity:1}
main{max-width:1280px;margin:0 auto;padding-block:16px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:3px;padding:16px;margin-bottom:16px}
.card.key{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px 16px}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.3}
.stat .v{font-size:20px;line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0} th:last-child,td:last-child{padding-right:0}
th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;vertical-align:bottom}
tr:last-child td{border-bottom:0}
tr.pickrow{cursor:pointer} tr.pickrow:hover td{background:var(--soft)} tr.pickrow.on td{background:var(--soft)} tr.pickrow.on td:first-child{box-shadow:inset 2px 0 var(--accent);padding-left:8px}
.scroll{overflow-x:auto}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.event{border-left:3px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:3px;margin:8px 0}
.event b{display:block;margin-bottom:2px}
.moves{display:flex;flex-direction:column;gap:6px}
.move{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 12px;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:var(--panel);transition:border-color .12s,background .12s}
.move:hover{border-color:var(--accent)}
.move.sel{border-color:var(--accent);background:var(--soft);box-shadow:inset 2px 0 var(--accent)}
.move input{margin:3px 0 0;accent-color:var(--accent);pointer-events:none}
.move .nm{font-weight:600} .move .bl{font-size:12px;color:var(--muted)}
.move .mc{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;min-width:88px}
.move .mc b{font-size:15px}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--brass);border:1px solid var(--brass);border-radius:2px;padding:0 4px;margin-left:8px;vertical-align:1px}
.pill{background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}

.tree{font-size:13px}

.bar{height:4px;border-radius:2px;background:var(--accent);margin-top:4px}
.log li{margin-bottom:6px}
.legend{display:flex;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}

.sup .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sup .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sup .v .to{color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:2px;padding:1px 6px;background:var(--soft)}

.supply h4{margin:8px 0 0;font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pend{display:inline-block;min-width:3.2em;height:.9em;border-radius:2px;background:var(--line);opacity:.7;vertical-align:-1px;animation:pend 1s ease-in-out infinite alternate}
@keyframes pend{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pend{animation:none} #simbar i{transition:none}}
.goal{display:grid;grid-template-columns:auto minmax(120px,1fr);gap:4px 12px;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}
.goal b{color:var(--ink)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 8px;font:12px/1.5 var(--mono);box-shadow:0 4px 12px rgba(0,0,0,.18);white-space:nowrap;display:none}
#tip b{font-weight:600} #tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
@media (max-width:600px){
  header,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:28px} .card{padding:12px} .supply{padding:8px 12px} .supply .cells{gap:4px 16px}
  .move{grid-template-columns:20px minmax(0,1fr)} .move .mc{grid-column:2;text-align:left;min-width:0}
  .stat .v{font-size:18px} .br{grid-template-columns:minmax(0,1.3fr) 36px minmax(0,1fr) minmax(0,1fr)}
}

<script>
// Market + portfolio engine for the wargame. No DOM code here.
// Each game year is two 6-month steps. Regime-switching Monte Carlo calibrated to US history (live check in the Model tab):
// long-run S&P ≈ 9.4%/yr mean, ≈18% vol, ~45% chance of a 20%+ drawdown in any 5-year window,
// ~17% chance a 5-year span ends below where it started. A valuation haircut (default 2%/yr)
// lowers expected returns because US stocks start this game expensive.
// The whole engine is one function so its source (WargameEngine.toString()) can also boot a Web Worker
// from a Blob URL. That keeps the page working from file:// with no server and no second file.
function WargameEngine(root) {
  "use strict";

  // Half-year parameters: [mean, vol] of US market, tech/AI factor, international-vs-US factor; cash yield per half.
  const REGIMES = [
    { id: "EXP", name: "Expansion", us: [0.08, 0.068], tech: [0.01, 0.06], intl: [0.0, 0.05], cash: 0.020,
      desc: "Steady growth. The most common state." },
    { id: "LATE", name: "Late-cycle / frothy", us: [0.065, 0.09], tech: [0.035, 0.10], intl: [-0.01, 0.05], cash: 0.022,
      desc: "Narrow, stretched rally. Usually ends in a slowdown." },
    { id: "CORR", name: "Correction / slowdown", us: [-0.04, 0.09], tech: [-0.03, 0.09], intl: [0.01, 0.06], cash: 0.020,
      desc: "Stocks off 10–20%. Recovery or recession, about even odds." },
    { id: "BEAR", name: "Recession / bear market", us: [-0.13, 0.125], tech: [-0.05, 0.12], intl: [-0.01, 0.07], cash: 0.012,
      desc: "Stocks down 20%+. Typically lasts 1–1.5 years." },
    { id: "RECOV", name: "Recovery", us: [0.16, 0.10], tech: [0.03, 0.10], intl: [0.0, 0.06], cash: 0.010,
      desc: "Rebound while the news still looks bad." },
    { id: "STAG", name: "Inflation / stagflation", us: [-0.025, 0.10], tech: [-0.04, 0.09], intl: [0.025, 0.07], cash: 0.025,
      desc: "Sticky inflation. Growth suffers; value and cash hold up." },
  ];
  const RIDX = Object.fromEntries(REGIMES.map((r, i) => [r.id, i]));

  // Half-year transition matrix (rows = from, cols = to), order as REGIMES.
  const T = [
    [0.67, 0.18, 0.09, 0.02, 0.00, 0.04],
    [0.19, 0.49, 0.20, 0.06, 0.00, 0.06],
    [0.28, 0.06, 0.22, 0.16, 0.24, 0.04],
    [0.00, 0.00, 0.10, 0.32, 0.58, 0.00],
    [0.64, 0.06, 0.10, 0.03, 0.17, 0.00],
    [0.14, 0.02, 0.22, 0.18, 0.12, 0.32],
  ];

  // Where we are now (Nov 2026, from the spreadsheet's 52-week data): S&P ~6% below its high, mega-cap tech and
  // semis 20–30% below highs, KDEF −58%. That reads as a tech-led wobble late in the cycle.
  const START_AUTO = [0.25, 0.35, 0.35, 0.05, 0.0, 0.0];

  // Event cards: p = rough base chance per half-year, m = multiplier by regime (EXP, LATE, CORR, BEAR, RECOV, STAG).
  // Effects are added to the factor returns for that turn (us/tech/intl) or to individual tickers (tk).
  const EVENTS = [
    { id: "capex", title: "AI capex digestion", p: 0.09, m: [0.7, 1.5, 1.4, 1.5, 0.6, 1.0],
      text: "Big tech cuts AI spending. Chips sell off.",
      fx: { tech: -0.10, tk: { NVDA: -0.12, ASML: -0.08, TSM: -0.08 } } },

  // ---------- RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(rng) {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function pick(rng, probs) {
    const u = rng(); let c = 0;
    for (let i = 0; i < probs.length; i++) { c += probs[i]; if (u < c) return i; }
    return probs.length - 1;
  }

  // ---------- Ticker universe ----------
  function buildUniverse(data) {
    const TK = {};
    for (const a of data.accounts) for (const h of a.holdings) {
      if (!TK[h.ticker]) TK[h.ticker] = {
        ticker: h.ticker, name: h.name, type: h.type, kind: h.kind, price: h.price,
        beta: h.type === "ETF" ? h.beta : 0.6 * h.beta + 0.4, // shrink noisy single-stock betas toward 1
        tech: h.tech, intl: h.intl, idio: h.idio, high52: h.high52 || h.price, low52: h.low52 || h.price,
      };
    }
    return TK;
  }

  function eventProbs(r) {
    const ps = EVENTS.map(e => e.p * e.m[r]);
    const s = ps.reduce((a, b) => a + b, 0);
    const scale = s > 0.85 ? 0.85 / s : 1;
    return ps.map(p => p * scale);
  }

  // Average effect of event cards, so events add shocks (fat tails) without dragging the long-run averages
  // away from the calibrated regime means. Computed once over the long-run regime mix.
  function stationary() { let pi = REGIMES.map(() => 1 / 6);
    for (let k = 0; k < 400; k++) pi = pi.map((_, j) => pi.reduce((s, x, i) => s + x * T[i][j], 0)); return pi; }
  let BIAS = null;
  function eventBias() {
    if (BIAS) return BIAS;
    const pi = stationary();
    BIAS = { us: 0, tech: 0, intl: 0, tk: {} };
    REGIMES.forEach((_, r) => { const ep = eventProbs(r);
      EVENTS.forEach((e, i) => { const w = pi[r] * ep[i];
        BIAS.us += w * (e.fx.us || 0); BIAS.tech += w * (e.fx.tech || 0); BIAS.intl += w * (e.fx.intl || 0);
        if (e.fx.tk) for (const t in e.fx.tk) BIAS.tk[t] = (BIAS.tk[t] || 0) + w * e.fx.tk[t]; }); });
    return BIAS;
  }

  // One half-year of market outcomes. Does not depend on the player's portfolio, so a seed fixes the whole future.
  function drawTurn(rng, prevR, TK, S) {
    const r = pick(rng, T[prevR]);
    const R = REGIMES[r];
    const hair = (S.haircut || 0) / 2;
    let us = R.us[0] - hair + R.us[1] * gauss(rng);
    let tech = R.tech[0] + R.tech[1] * gauss(rng);
    let intl = R.intl[0] + R.intl[1] * gauss(rng);
    let cash = R.cash;
    let ev = null;
    const ep = eventProbs(r);
    const u = rng(); let c = 0;
    for (let i = 0; i < EVENTS.length; i++) { c += ep[i]; if (u < c) { ev = EVENTS[i]; break; } }
    const fx = ev ? ev.fx : {}, B = eventBias();
    us += (fx.us || 0) - B.us; tech += (fx.tech || 0) - B.tech; intl += (fx.intl || 0) - B.intl; cash += fx.cash || 0;
    const ret = {};
    for (const t in TK) {
      const k = TK[t];
      let x = k.beta * us + k.tech * tech + k.intl * intl + k.idio * gauss(rng);
      if (k.type === "Stock") { const j = rng(); if (j < 0.025) x -= 0.25; else if (j > 0.975) x += 0.20; }
      x += ((fx.tk && fx.tk[t]) || 0) - (B.tk[t] || 0);
      ret[t] = Math.max(-0.85, x);
    }
    return { r, us, tech, intl, mkt: us + 0.3 * tech, cash: Math.max(0, cash), ev, ret, expense: fx.expense || 0 };
  }

  function genPath(seed, H, startR, TK, S) {
    const rng = mulberry32(seed);
    const path = []; let prev = startR;
    for (let t = 0; t < H; t++) { const d = drawTurn(rng, prev, TK, S); path.push(d); prev = d.r; }
    return path;
  }

  // ---------- Historical replay ----------
  // A real stretch of market history played as the campaign's actual future (the decision previews stay Monte Carlo:
  // what you could have known at the time). Index levels are half-year closes, Dec 1999 → Dec 2004 (Yahoo Finance):
  // S&P 500 total return, Nasdaq Composite, and a fund tracking MSCI EAFE (VTMGX, dividends reinvested). cash =
  // average 3-month T-bill yield per half. r = hand-labelled market state. Today's holdings did not all exist then,
  // so each one follows the indexes through its beta, tech load and international load. No random noise: a replay
  // is the same every time.
  const HISTORY = {
    dotcom: { id: "dotcom", name: "Dot-com bust, 2000–04", year0: 2000, start: [0.25, 0.6, 0.15, 0, 0, 0],
      intro: "It is January 2000. The Nasdaq has nearly doubled in a year and the S&P 500 is at a record.",
      sp: [2021.40, 2012.83, 1837.37, 1714.32, 1618.98, 1405.94, 1261.18, 1409.48, 1622.94, 1678.83, 1799.55],
      nq: [4069.31, 3966.11, 2470.52, 2160.54, 1950.40, 1463.21, 1335.51, 1622.80, 2003.37, 2047.79, 2175.44],
      ex: [5.904, 5.657, 5.061, 4.322, 3.951, 3.905, 3.333, 3.649, 4.621, 4.849, 5.557],
      cash: [0.0281, 0.0300, 0.0206, 0.0120, 0.0086, 0.0072, 0.0054, 0.0046, 0.0050, 0.0091],
      r: [1, 2, 3, 3, 3, 3, 4, 4, 0, 0],
      news: ["The Nasdaq peaks in March", "Dot-com shares collapse", "Recession begins and the Fed cuts rates", "September 11 attacks and Enron's failure",
        "WorldCom and the accounting scandals", "The market bottoms in October", "The Iraq war begins and stocks turn up", "The recovery broadens",
        "The Fed starts raising rates", "A steady expansion"] },
  };
  // Factors are solved backwards so the engine reproduces the indexes: the S&P is us + 0.3·tech (as for SPY/VOO),
  // a beta-1 fund with tech load 1 matches the Nasdaq, and a beta-1 fund with international load 1 matches EAFE.
  function histPath(id, TK) {
    const h = HISTORY[id], path = [];
    for (let t = 0; t < h.cash.length; t++) {
      const s = h.sp[t + 1] / h.sp[t] - 1, q = h.nq[t + 1] / h.nq[t] - 1, e = h.ex[t + 1] / h.ex[t] - 1;
      const tech = (q - s) / 0.7, us = s - 0.3 * tech, intl = e - us, ret = {};
      for (const k in TK) ret[k] = Math.max(-0.85, TK[k].beta * us + TK[k].tech * tech + TK[k].intl * intl);
      path.push({ r: h.r[t], us, tech, intl, mkt: s, cash: h.cash[t], ev: { title: h.news[t] }, ret, expense: 0 });
    }
    return path;
  }

  // ---------- Portfolio ----------
  function initPortfolio(data, TK) {
    const p = { accts: [], prices: {}, peaks: {}, lossCarry: 0, taxPaid: 0, turnTax: 0,
      bankNet: data.bankNet, spx: 1, spxPeak: 1, spxTrough: 1, out: false };
    for (const t in TK) { p.prices[t] = TK[t].price; p.peaks[t] = Math.max(TK[t].high52, TK[t].price); }
    for (const a of data.accounts) p.accts.push({
      id: a.id, role: a.role, label: a.label, taxable: a.taxable, cash: a.cash,
      pos: a.holdings.map(h => ({ t: h.ticker, sh: h.shares, cost: h.cost })),
    });
    p.startMix = p.accts.map(a => mixOf(p, a));
    const core = Object.values(TK).find(k => k.kind === "US core"); // S&P index starts below its 52-week high
    p.spxPeak = core ? core.high52 / core.price : 1;
    return p;
  }
  // Hand-written copy (about 5x faster than a JSON round trip). startMix is never mutated, so it is shared.
  function clone(p) {
    const q = Object.assign({}, p);
    q.prices = Object.assign({}, p.prices); q.peaks = Object.assign({}, p.peaks);
    q.accts = p.accts.map(a => { const b = Object.assign({}, a); b.pos = a.pos.map(h => ({ t: h.t, sh: h.sh, cost: h.cost })); return b; });
    return q;
  }
  const acct = (p, id) => p.accts.find(a => a.id === id);
  const main = p => p.accts.find(a => a.role === "main") || p.accts[0]; // where savings land and spare cash is spent
  const posVal = (p, h) => h.sh * p.prices[h.t];
  const acctVal = (p, a) => a.cash + a.pos.reduce((s, h) => s + posVal(p, h), 0);
  const total = p => p.accts.reduce((s, a) => s + acctVal(p, a), 0) + (p.bankNet || 0);
  function embeddedTax(p, S) {
    let g = 0;
    for (const a of p.accts) if (a.taxable) for (const h of a.pos) g += posVal(p, h) - h.cost;
    return Math.max(0, g - p.lossCarry) * S.ltcg;
  }
  const afterTax = (p, S) => total(p) - embeddedTax(p, S);

  function category(TK, t) { return (TK[t] && TK[t].kind) || "Stock"; }
  function mixOf(p, a) {
    const v = acctVal(p, a) || 1, m = { Cash: a.cash / v };
    for (const h of a.pos) { const c = category(Model.TK, h.t); m[c] = (m[c] || 0) + posVal(p, h) / v; }
    return m;
  }

  function sell(p, a, t, dollars, S) {
    const i = a.pos.findIndex(h => h.t === t); if (i < 0) return 0;
    const h = a.pos[i], px = p.prices[t];
    const sh = Math.min(h.sh, Math.max(0, dollars) / px); if (sh <= 1e-9) return 0;
    const basis = h.cost * (sh / h.sh), proceeds = sh * px;
    h.sh -= sh; h.cost -= basis; a.cash += proceeds;
    if (a.taxable) {
      let g = proceeds - basis;
      if (g < 0) p.lossCarry += -g;
      else { const off = Math.min(g, p.lossCarry); p.lossCarry -= off; g -= off;
        const tax = g * S.ltcg; a.cash -= tax; p.taxPaid += tax; p.turnTax += tax; }
    }
    if (h.sh < 1e-7) a.pos.splice(i, 1);
    return proceeds;
  }
  function buy(p, a, t, dollars) {
    dollars = Math.min(dollars, a.cash); if (dollars < 1 || !t || !p.prices[t]) return 0;
    let h = a.pos.find(x => x.t === t);
    if (!h) { h = { t, sh: 0, cost: 0 }; a.pos.push(h); }
    h.sh += dollars / p.prices[t]; h.cost += dollars; a.cash -= dollars;
    return dollars;
  }
  // Sell $ from a set of tickers in an account, highest cost-basis-per-dollar first (least tax).
  function sellTaxSmart(p, a, tickers, dollars, S) {
    const hs = a.pos.filter(h => tickers.includes(h.t))
      .sort((x, y) => (y.cost / posVal(p, y)) - (x.cost / posVal(p, x)));
    let left = dollars, got = 0;
    for (const h of hs) { if (left <= 1) break; const v = Math.min(left, posVal(p, h)); got += sell(p, a, h.t, v, S); left -= v; }
    return got;
  }
  const isStock = t => Model.TK[t] && Model.TK[t].type === "Stock";
  // Groups come from each holding's `kind` (set in build.py), so they follow the spreadsheet.
  const ofKind = (...kinds) => Object.keys(Model.TK).filter(t => kinds.includes(Model.TK[t].kind));
  const heldValue = (p, t) => p.accts.reduce((s, a) => s + a.pos.filter(h => h.t === t).reduce((q, h) => q + posVal(p, h), 0), 0);
  const largest = (p, list) => list.slice().sort((x, y) => heldValue(p, y) - heldValue(p, x))[0];
  const CORE = () => ofKind("US core");
  const TECH = () => ofKind("Semiconductors", "Mega-cap tech");
  const coreFund = p => largest(p, CORE()) || largest(p, Object.keys(Model.TK));
  const qualityPick = p => largest(p, ofKind("Quality value")) || largest(p, ofKind("Quality compounder")) || coreFund(p);
  const intlFund = p => largest(p, ofKind("International"));
  const growthFund = p => largest(p, ofKind("US growth")) || coreFund(p);
  const spare = (a, S) => Math.max(0, a.cash - S.reserve);
  // Sell then rebuy in the same account using only the after-tax proceeds (never dips into the cash reserve).
  function swap(p, a, sellFn, buyT) { const c0 = a.cash; sellFn(); const got = Math.max(0, a.cash - c0); if (buyT) buy(p, a, buyT, got); return got; }

  // ---------- Moves ----------
  // Each apply(p, S, arg) mutates p and returns a short summary. `opts` describes a move's choices for the UI.
  const MOVES = [
    { id: "HOLD", name: "Hold steady", blurb: "", apply: () => "No trades." },
    { id: "DEPLOY", name: "Invest spare cash", blurb: "Spare cash into your S&P fund.",
      opts: { f: [[0.5, "Half"], [1, "All"]] }, def: { f: 1 },
      apply(p, S, arg) { const f = (arg || this.def).f, a = main(p), t = coreFund(p), amt = spare(a, S) * f;
        buy(p, a, t, amt); let other = 0;
        if (f === 1) for (const b of p.accts) if (b !== a && b.cash > 100) { other += b.cash; buy(p, b, b.role === "growth" ? growthFund(p) : t, b.cash); }
        return `Invested ${fmt(amt)} in ${t}${other > 1 ? `, plus ${fmt(other)} of idle cash elsewhere` : ""}.`; } },
    { id: "BUY_DIP", name: "Buy your beaten-down stocks", blurb: "Spare cash into your 3 stocks furthest off their peaks.",
      apply(p, S) { const a = main(p), amt = spare(a, S);
        const c = Object.keys(Model.TK).filter(isStock).map(t => [t, p.prices[t] / p.peaks[t] - 1]).sort((x, y) => x[1] - y[1]).slice(0, 3);
        c.forEach(([t]) => buy(p, a, t, amt / c.length));
        return amt > 1 ? `Bought ${fmt(amt / c.length)} each of ${c.map(([t, d]) => `${t} (${pct(d)} from peak)`).join(", ")}.` : "No spare cash above your reserve."; } },
    { id: "TRIM", name: "Trim concentrated stocks", blurb: "Any stock over your cap goes back to the cap. Roth first.",
      apply(p, S) { const cap = S.cap * total(p), core = coreFund(p), out = [];
        for (const t of Object.keys(Model.TK).filter(isStock)) {
          let excess = heldValue(p, t) - cap; if (excess <= 1) continue; out.push(`${t} −${fmt(excess)}`);
          for (const a of [...p.accts].sort((x, y) => x.taxable - y.taxable)) { if (excess <= 1) break; const h = a.pos.find(x => x.t === t); if (!h) continue;
            const s = Math.min(excess, posVal(p, h)); swap(p, a, () => sell(p, a, t, s, S), core); excess -= s; } }
        return out.length ? `Trimmed ${out.join(", ")} → ${core}.` : `No stock is above ${pct(S.cap)} of net worth.`; } },
    { id: "CUT_TECH", name: "Cut tech & semis", blurb: "Sell part of every chip and big-tech stock.",
      opts: { f: [[0.25, "25%"], [0.5, "50%"]], to: [["core", "into S&P"], ["quality", "into quality"]] }, def: { f: 0.25, to: "core" },
      apply(p, S, arg) { arg = arg || this.def; const dest = arg.to === "quality" ? qualityPick(p) : coreFund(p); let moved = 0;
        for (const a of p.accts) for (const t of TECH()) { const h = a.pos.find(x => x.t === t); if (!h) continue;
          moved += swap(p, a, () => sell(p, a, t, posVal(p, h) * arg.f, S), dest); }
        return `Moved ${fmt(moved)} from tech into ${dest}.`; } },
    { id: "TRADE", name: "Trade one position", blurb: "Buy or sell any one holding.",
      opts: { side: [["sell", "Sell"], ["buy", "Buy"]], f: [[0.1, "10%"], [0.25, "25%"], [0.5, "50%"], [1, "All"]] }, def: { side: "sell", t: null, f: 0.25 },
      apply(p, S, arg) { arg = arg || this.def; const t = arg.t; if (!t || !p.prices[t]) return "Nothing selected.";
        if (arg.side === "buy") { const a = main(p), amt = spare(a, S) * arg.f; buy(p, a, t, amt);
          return amt > 1 ? `Bought ${fmt(amt)} of ${t}.` : "No spare cash above your reserve."; }
        let got = 0; const tax0 = p.turnTax;
        for (const a of p.accts) { const h = a.pos.find(x => x.t === t); if (h) got += swap(p, a, () => sell(p, a, t, posVal(p, h) * arg.f, S)); }
        return got > 0 ? `Sold ${Math.round(arg.f * 100)}% of ${t}: ${fmt(got)} to cash after ${fmt(p.turnTax - tax0)} tax.` : `You don't hold ${t}.`; } },
    { id: "INTL", name: "Diversify abroad", blurb: "5% of net worth from S&P into international.",
      apply(p, S) { const a = main(p), t = intlFund(p); if (!t) return "No international fund to buy.";
        const got = swap(p, a, () => sellTaxSmart(p, a, CORE(), 0.05 * total(p), S), t); return `Moved ${fmt(got)} into ${t}.`; } },
    { id: "TLH", name: "Tax-loss harvest", blurb: "Book losses on positions 5%+ below cost. Same exposure.",
      apply(p, S) { let loss = 0; const names = [];
        for (const a of p.accts) if (a.taxable) for (const h of a.pos) { const v = posVal(p, h);
          if (v < h.cost * 0.95) { loss += h.cost - v; names.push(h.t); h.cost = v; } }
        p.lossCarry += loss;
        return loss > 0 ? `Harvested ${fmt(loss)} of losses (${names.join(", ")}).` : "Nothing is 5% below cost."; } },
    { id: "REBAL", name: "Rebalance to starting mix", blurb: "Back to today's mix in each account.",
      apply(p, S) { let traded = 0;
        p.accts.forEach((a, i) => {
          const tgt = p.startMix[i], cur = mixOf(p, a), v = acctVal(p, a);
          for (const c in cur) if (c !== "Cash" && cur[c] > (tgt[c] || 0) + 0.01) {
            const tks = a.pos.filter(h => category(Model.TK, h.t) === c).map(h => h.t); const amt = (cur[c] - (tgt[c] || 0)) * v;
            sellTaxSmart(p, a, tks, amt, S); traded += amt; }
          const after = mixOf(p, a), v2 = acctVal(p, a), extra = a.cash - (tgt.Cash || 0) * v2;
          const under = Object.keys(tgt).filter(c => c !== "Cash" && (after[c] || 0) < tgt[c]);
          const gap = under.reduce((s, c) => s + tgt[c] - (after[c] || 0), 0);
          if (extra > 1 && gap > 0) for (const c of under) {
            const h = a.pos.filter(x => category(Model.TK, x.t) === c).sort((x, y) => posVal(p, y) - posVal(p, x))[0];
            if (h) buy(p, a, h.t, extra * (tgt[c] - (after[c] || 0)) / gap);
          }
        });
        return `Rebalanced about ${fmt(traded)}.`; } },
    { id: "DERISK", hidden: true, name: "Raise cash broadly", // used only by the Lab's panic-seller rule
      apply(p, S) { let raised = 0;

  const EXCLUSIVE = [["DEPLOY", "BUY_DIP", "TRADE"]];

  // ---------- Turn engine ----------

    dip: { name: "Dip buyer", desc: "Invest only when the S&P is 10%+ off peak.", fn: (p, t, S) => { if (p.spx / p.spxPeak < 0.9) MOVE.DEPLOY.apply(p, S, { f: 1 }); } },

      fn: (p, t, S) => { if (t === 0) MOVE.CUT_TECH.apply(p, S, { f: 0.5, to: "quality" }); } },
    panic: { name: "Panic seller", desc: "Sell 25% after a 15% drop, rebuy after a 20% rebound.",

<script>

  // ---------- Settings ----------

  // ---------- Dates (from when the spreadsheet was last saved) ----------

  const START = new Date(D.modified);
  const halfLabel = i => { if (G && G.scn) return `${i % 2 ? "Jul" : "Jan"} ${G.scn.year0 + (i >> 1)}`; // replay: the real dates
    const m = START.getMonth() + 6 * i; return `${MONTHS[m % 12]} ${START.getFullYear() + Math.floor(m / 12)}`; };
  const yearLabel = t => halfLabel(2 * t);

  // ---------- Game ----------

  const nextYearOdds = () => { const b = belief();

  function newGame(seed) {

    const p = M.initPortfolio(D, M.TK);
    const scn = M.HISTORY[S.scenario] || null; // historical replay: the real path is history, and it sets the length
    if (scn) p.spxPeak = p.spx; // the replay opens at a record high, not today's distance from one
    const g = G = { seed, scn, H: scn ? scn.cash.length / 2 : S.years, startR,
      path: scn ? M.histPath(scn.id, M.TK) : M.genPath(seed, 2 * S.years, startR, M.TK, S), t: 0, p, shadow: M.clone(p),

  function biggestStock(p) {

  // ---------- Simulation (one session of futures per year; a click only computes the plan it changed) ----------

  // ---------- Charts ----------
  const tipEl = $("#tip");

  // Lines + percentile bands on one dollar axis. Hover shows a crosshair and the values at that date.
  function lineChart(canvas, opt, hover) {

      x => { const i = Math.round((x - 54) / (canvas.clientWidth - 64) * (opt.n - 1)); return i < 0 || i > opt.n - 1 ? null : i; });
    const n = opt.n, L = 54, R = 10, Tp = 12, B = 24;

      g.fillStyle = css("--muted"); g.textAlign = "left"; g.fillText(m.label, L + 6, y - 5); }

  // Distribution of a difference across futures: gains one colour, losses the other, zero on a bin edge.
  function histChart(canvas, opt, hover) {
    const all = opt.values, n = all.length, v = Float64Array.from(all).filter(x => Math.abs(x) > 1).sort(), ties = n - v.length;
    const h = (opt.height || 120) + (ties ? 16 : 0), L = 8, R = 8, Tp = ties ? 24 : 8, B = 22;
    let lo = Math.min(0, M.quantS(v, 0.02)), hi = Math.max(0, M.quantS(v, 0.98));
    const flat = hi - lo < 2, bw = flat ? 1 : (hi - lo) / 28, k0 = Math.ceil(-lo / bw - 1e-9), nb = flat ? 1 : k0 + Math.ceil(hi / bw - 1e-9);

    for (let b = 0; b < nb; b++) { if (!bins[b]) continue; const bh = Math.max(2, (h - Tp - B) * bins[b] / mx);

  // Supply line: cash and positions, always in view, showing what your plan would change.

      return `<h4>${a.id} · ${esc(a.label)} · ${fmt(M.acctVal(p, a))}</h4><div class="chips">${chips}<span class="chip">Cash ${fmt(a.cash)}</span></div>`;
    }).join("") + `<div class="note">Banks ${fmt(p.bankNet)} net${q ? " · gold = plan changes" : ""}</div>` : "";
    return `<div class="supply"><div class="cells">${cells.join("")}
      <button class="ghost" id="supToggle" style="margin-left:auto;padding:4px 10px">${SUPPLY_OPEN ? "Hide" : "Show"} positions</button></div>${detail}</div>`;
  }

  function optsHTML(mv) {
    const a = G.args[mv.id], groups = [];
    if (mv.id === "TRADE") {
      groups.push(btns(mv.id, "side", mv.opts.side, a.side));
      const list = a.side === "sell" ? [...new Set(G.p.accts.flatMap(x => x.pos.map(h => h.t)))] : Object.keys(M.TK);
      groups.push(`<select class="optSel" data-mv="TRADE">${list.map(t => [t, M.heldValue(G.p, t)]).sort((x, y) => y[1] - x[1])
        .map(([t, v]) => `<option value="${t}" ${t === a.t ? "selected" : ""}>${t}${v ? " · " + fmt(v) : ""}</option>`).join("")}</select>`);
      groups.push(btns(mv.id, "f", mv.opts.f, a.f) + `<span class="note">${a.side === "sell" ? `≈ ${fmt(M.heldValue(G.p, a.t) * a.f)}` : `≈ ${fmt(Math.max(0, M.main(G.p).cash - S.reserve) * a.f)}`}</span>`);
    } else for (const k in mv.opts) groups.push(btns(mv.id, k, mv.opts[k], a[k]));
    return `<div class="row opts" style="margin-top:8px;gap:6px">${groups.join("")}</div>`;
  }
  const btns = (id, key, list, cur) => list.map(([v, label]) => `<button class="pill ${v === cur ? "on" : ""}" data-mv="${id}" data-k="${key}" data-v="${v}">${label}</button>`).join("");

  function movesHTML() {
    const single = visibleMoves().filter(m => m.id !== "HOLD").map(m => [m.id, stat([m.id], [])]);
    const best = single.every(x => x[1]) ? single.slice().sort((a, b) => b[1].d50 - a[1].d50)[0] : null;
    const rows = visibleMoves().map(mv => {
      const on = G.plan.has(mv.id), r = mv.id === "HOLD" ? null : stat([mv.id], []);
      return `<div class="move ${on ? "sel" : ""}" data-mv="${mv.id}">
        <input type="checkbox" ${on ? "checked" : ""} tabindex="-1" aria-label="${mv.name}">
        <div><div class="nm">${mv.name}${best && best[0] === mv.id && best[1].d50 > 500 ? `<span class="tag">RECOMMENDED</span>` : ""}</div>
          ${mv.blurb ? `<div class="bl">${mv.blurb}</div>` : ""}${on && mv.opts ? optsHTML(mv) : ""}</div>
        <div class="mc">${mv.id === "HOLD" ? `<span class="muted">baseline</span>` : r ? `<b class="${tone(r.d50)}">${sfmt(r.d50)}</b>` : PEND}</div></div>`;
    }).join("");
    return `<div class="card"><h2>1 · Courses of action</h2>
      <p class="note">Pick any. Number = typical gain vs holding by ${yearLabel(G.H)}, after tax.</p>
      <div class="moves">${rows}</div></div>`;
  }

  function triggersHTML() {
    return `<div class="card"><h2>2 · Standing orders <span class="muted">· checked ${halfLabel(2 * G.t + 1)}</span></h2>
      <div class="moves">${M.TRIGGERS.map(tg => { const r = stat([], [tg]), on = G.trig.has(tg.id);
        return `<div class="move ${on ? "sel" : ""}" data-tg="${tg.id}"><input type="checkbox" ${on ? "checked" : ""} tabindex="-1" aria-label="${tg.name}">
          <div><div class="nm">${tg.name}</div><div class="bl">${tg.text}${r ? ` Fires ${pctU(r.fired)}.` : ""}</div></div>
          <div class="mc">${!r ? PEND : r.fired > 0.005 ? `<b class="${tone(r.d50)}">${sfmt(r.d50)}</b>` : `<span class="muted">rare</span>`}</div></div>`; }).join("")}</div></div>`;
  }

  // Why the plan scores the way it does: which next-year market it is a bet on, and what it costs up front.
  function whyText(r, pv) {
    const xs = Object.entries(r.br).filter(x => x[1].n >= 8).map(([j, b]) => [+j, b.d50]).sort((a, b) => b[1] - a[1]);
    const out = [], hi = xs[0], lo = xs[xs.length - 1];
    if (hi && hi[1] > 500) out.push(`Pays most when the year ends in ${shortName(hi[0])} (<b class="good">${sfmt(hi[1])}</b> typical)`);
    if (lo && lo[1] < -500) out.push(`${out.length ? "costs" : "Costs"} most in ${shortName(lo[0])} (<b class="bad">${sfmt(lo[1])}</b>)`);
    let s = out.length ? out.join("; ") + "." : "Makes little difference in any market state.";
    if (Math.abs(r.dMean - r.d50) > Math.max(1000, Math.abs(r.d50))) s += ` A minority of futures drive it: average ${sfmt(r.dMean)} vs typical ${sfmt(r.d50)}.`;
    if (pv.taxNow > 500) s += ` Starts ${fmt(pv.taxNow)} behind from tax paid now.`;
    return s;
  }
  function planHTML() {
    const ids = planIds(), tg = trigs(), r = stat(ids, tg), pv = preview(ids), any = ids.length || tg.length;
    return `<div class="card key"><h2>3 · Operation order · ${yearLabel(G.t)} → ${yearLabel(G.t + 1)}</h2>
      <p style="margin:0 0 12px"><b>${ids.length ? ids.map(id => M.MOVE[id].name).join(" + ") : "Hold steady"}</b>${tg.length ? ` · if-then: ${tg.map(x => x.name).join(", ")}` : ""}</p>
      ${any ? `<div class="stats">
        <div class="stat"><div class="k">Bad case</div><div class="v">${money(r && r.d10)}</div></div>
        <div class="stat"><div class="k">Typical</div><div class="v">${money(r && r.d50)}</div></div>
        <div class="stat"><div class="k">Good case</div><div class="v">${money(r && r.d90)}</div></div>
        <div class="stat"><div class="k">Tax now</div><div class="v">${fmt(pv.taxNow)}</div></div></div>
        <p class="note">vs holding by ${yearLabel(G.H)}${r ? ` · beats holding in ${pctU(r.pWin)} of futures${tg.length ? ` · orders fire ${pctU(r.fired)}` : ""}` : ""}</p>
        ${r ? `<canvas id="planHist" aria-label="Distribution of plan minus holding across futures"></canvas><div class="why">${whyText(r, pv)}</div>` : ""}
        ${ids.length ? `<ul class="note" style="margin:8px 0;padding-left:18px">${pv.would.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`
        : `<p class="note">No trades.</p>`}
      <p class="note">Market range by ${yearLabel(G.H)}: ${r ? `${fmt(r.p10)} to ${fmt(r.p90)}` : PEND}</p>
      <button class="primary" id="commitBtn" style="width:100%">Execute orders · ${yearLabel(G.t)} → ${yearLabel(G.t + 1)}</button></div>`;
  }
  function drawPlanHist() {
    const c = $("#planHist"); if (!c) return;
    const r = G.cache.stats[planKey(planIds(), trigs())], h = G.cache.stats.hold; if (!r || !h) return;
    histChart(c, { values: r.afters.map((x, i) => x - h.afters[i]), height: 110 });
  }

  // Risk picture: the plan and plain holding side by side on the same futures.
  function riskHTML() {
    const ids = planIds(), tg = trigs(), any = ids.length || tg.length, r = stat(ids, tg), h = stat([], []), goal = goalV();
    const row = (label, f, show, better, eps, id) => { const a = r && f(r), b = h && f(h), d = a != null && b != null ? (a - b) * better : 0;
      return `<tr><td>${label}</td>${any ? `<td class="n ${d > eps ? "good" : d < -eps ? "bad" : ""}"${id ? ` id="${id}A"` : ""}><b>${a == null ? PEND : show(a)}</b></td>` : ""}
        <td class="n"${id ? ` id="${id}B"` : ""}>${b == null ? PEND : show(b)}</td></tr>`; };
    return `<div class="card"><h2>Risk picture · by ${yearLabel(G.H)}</h2><div class="scroll"><table>
      <tr><th></th>${any ? "<th>Your plan</th>" : ""}<th>Just holding</th></tr>
      ${row("Reaches the goal", x => pGoal(x.afters, goal), pctU, 1, 0.015, "pg")}
      ${row("Worst 10% of futures, average", x => x.cvar, fmt, 1, 500)}
      ${row("Typical worst drop on the way", x => x.ddMed, x => pct(x), 1, 0.01)}
      ${row("Bad-case worst drop", x => x.ddBad, x => pct(x), 1, 0.01)}
      ${row("Chance of a 20%+ drop", x => x.pDD20, pctU, -1, 0.015)}
      ${row("Ends below today", x => x.pLoss, pctU, -1, 0.015)}</table></div>
      <div class="goal"><span>Goal <b id="goalLbl">${S.goal.toFixed(2)}× · ${fmt(goal)}</b></span>
        <input type="range" id="goalR" min="1" max="3" step="0.05" value="${S.goal}" aria-label="Goal as a multiple of starting net worth"></div></div>`;
  }
  // Dragging the goal only patches three numbers and the chart line; no simulation, no re-render.
  let goalRaf = 0;
  function goalDrag(v) {
    S.goal = v;
    if (goalRaf) return;
    goalRaf = requestAnimationFrame(() => { goalRaf = 0; const goal = goalV(), C = G.cache.stats, r = C[planKey(planIds(), trigs())], h = C.hold;
      $("#goalLbl").textContent = `${S.goal.toFixed(2)}× · ${fmt(goal)}`;
      const a = $("#pgA"), b = $("#pgB"); if (a && r) a.firstChild.textContent = pctU(pGoal(r.afters, goal)); if (b && h) b.textContent = pctU(pGoal(h.afters, goal));
      drawHist(); });
  }

  function treeHTML() {
    const odds = nextYearOdds(), r = stat(planIds(), trigs()), maxp = Math.max(...odds), any = planIds().length || trigs().length;
    const rows = odds.map((x, j) => [x, j]).filter(x => x[0] >= 0.03).sort((a, b) => b[0] - a[0]).map(([x, j]) => {
      const b = r && r.br[j], ok = b && b.n >= 5;
      return `<div class="br"><div>${stateDot(j)} <b>${M.REGIMES[j].name}</b><div class="bar" style="width:${x / maxp * 100}%;background:${rcol(j)}"></div></div>
        <div><b>${pctU(x)}</b></div><div>${!r ? PEND : ok ? `<b class="${cls(b.book)}">${pct(b.book, 1)}</b>` : `<span class="muted">rare</span>`}</div>
        <div>${!any ? `<span class="muted">—</span>` : !r ? PEND : ok ? `<b class="${tone(b.d50)}">${sfmt(b.d50)}</b>` : `<span class="muted">rare</span>`}</div></div>`;
    }).join("");
    return `<div class="card tree"><h2>Threat assessment · ${yearLabel(G.t + 1)}</h2>
      <div class="br hd"><div>Market state</div><div>Odds</div><div>Your book, 1 yr</div><div>Plan vs hold</div></div>
${rows}<p class="note" style="margin-bottom:0">Plan vs hold = typical edge by ${yearLabel(G.H)} in the futures where the market is in that state a year from now.</p></div>`;
  }

  function chartHTML() {
    return `<div class="card"><h2>Campaign track · after-tax net worth</h2><canvas id="histChart" aria-label="Net worth history and projected range"></canvas>
      <div class="legend"><span><i style="background:var(--you)"></i>You</span><span><i class="dash"></i>Just holding</span>
      <span><i style="background:var(--spx)"></i>S&amp;P 500</span>${G.t < G.H ? `<span><i class="band" style="background:var(--you)"></i>plan: 10–90% and 25–75% of futures, median dotted</span>` : ""}</div></div>`;
  }
  function drawHist() {
    const c = $("#histChart"); if (!c) return;
    const r = G.t < G.H ? G.cache.stats[planKey(planIds(), trigs())] : null, v0 = G.hist[0].you, you = css("--you");
    lineChart(c, { n: 2 * G.H + 1, xl: halfLabel, height: 240,
      marks: [{ v: goalV(), color: css("--brass"), label: `goal ${S.goal.toFixed(2)}×` }],
      bands: r ? [{ x0: 2 * G.t, data: r.band.map(b => [b[0], b[4]]), color: you, alpha: 0.13, label: "10–90%" },
        { x0: 2 * G.t, data: r.band.map(b => [b[1], b[3]]), color: you, alpha: 0.16, label: "25–75%" }] : [],
      series: [
        { data: G.hist.map(h => h.spx / G.hist[0].spx * v0), color: css("--spx"), width: 1.5, label: "S&amp;P 500" },
        { data: G.hist.map(h => h.hold), color: css("--shadow"), width: 1.5, dash: [5, 4], label: "Holding" },
        ...(r ? [{ x0: 2 * G.t, data: r.band.map(b => b[2]), color: you, width: 1.5, dash: [1, 4], label: "Plan median" }] : []),
        { data: G.hist.map(h => h.you), color: you, width: 2.5, label: "You" },
      ] });
  }

  function holdingsHTML() {
    const p = G.p, tot = M.total(p), last = G.log[G.log.length - 1];
    return `<div class="card"><details><summary>Order of battle · ${fmt(tot)} before tax</summary>${p.accts.map(a => {
      const rows = a.pos.slice().sort((x, y) => M.posVal(p, y) - M.posVal(p, x)).map(h => {
        const val = M.posVal(p, h), ch = last ? p.prices[h.t] / last.before[h.t] - 1 : null;
        return `<tr><td><b>${h.t}</b></td><td>${fmt(val)}</td><td>${(val / tot * 100).toFixed(1)}%</td>
          <td class="${ch == null ? "" : cls(ch)}">${ch == null ? "—" : pct(ch, 1)}</td><td class="${cls(val - h.cost)}">${fmt(val - h.cost)}</td></tr>`;
      }).join("");
      return `<h3>${a.id} · ${esc(a.label)} · ${fmt(M.acctVal(p, a))}</h3><div class="scroll"><table>
        <tr><th>Holding</th><th>Value</th><th>% NW</th><th>Last year</th><th>Gain vs cost</th></tr>${rows}
        <tr><td>Cash</td><td>${fmt(a.cash)}</td><td>${(a.cash / tot * 100).toFixed(1)}%</td><td></td><td></td></tr></table></div>`;
    }).join("")}</details></div>`;
  }

  function endHTML() {
    const at = M.afterTax(G.p, S), v0 = G.hist[0].you, cagr = (at / v0) ** (1 / G.H) - 1, hold = M.afterTax(G.shadow, S);
    const luck = G.baseAfters ? G.baseAfters.filter(x => x <= hold).length / G.baseAfters.length : null;
    let peak = 0, mdd = 0; for (const h of G.hist) { peak = Math.max(peak, h.you); mdd = Math.min(mdd, h.you / peak - 1); }
    return `<div class="card key"><h2>After-action report · ${yearLabel(G.H)}</h2>
      <div class="stats">
        <div class="stat"><div class="k">Net worth after tax</div><div class="v">${fmt(at)}</div><div class="note">${pct(cagr, 1)}/yr · goal ${at >= goalV() ? "reached" : "missed"}</div></div>
        <div class="stat"><div class="k">Skill: vs just holding</div><div class="v ${cls(gap())}">${sfmt(gap())}</div></div>
        <div class="stat"><div class="k">Luck: market you drew</div><div class="v">${luck == null ? PEND : ord(Math.round(luck * 100)) + " pct"}</div></div>
        <div class="stat"><div class="k">Worst drop</div><div class="v bad">${pct(mdd)}</div></div>
      </div>
      <div class="scroll" style="margin-top:12px"><table><tr><th>Year</th><th>Market</th><th>What you did</th><th>Book</th><th>vs holding</th></tr>
      ${G.log.map(L => `<tr><td>${L.year}</td><td style="text-align:left">${stateDot(L.h1.r)}${stateDot(L.h2.r)} ${M.REGIMES[L.h2.r].name}</td>
        <td style="text-align:left;white-space:normal">${esc([...(L.names.length ? L.names : ["Hold"]), ...L.fired.map(x => x.split(":")[0])].join(", "))}</td>
        <td class="${cls(L.ret)}">${pct(L.ret, 1)}</td><td class="${cls(L.gain)}"><b>${sfmt(L.gain)}</b></td></tr>`).join("")}</table></div>
      <p class="note">Skill = your calls vs holding. Luck = how good this market was.</p>
      <div class="row"><button class="primary" id="replayBtn">Replay same market</button><button class="ghost" id="newBtn">New campaign</button>
      <button class="ghost" id="copyBtn">Copy my playbook</button></div></div>`;
  }

  function logHTML() {
    if (!G.log.length || G.t >= G.H) return "";
    return `<div class="card"><details><summary>Operations log</summary><ol class="log">${G.log.map(L =>
      `<li><b>${L.year}</b>: ${L.did.length ? L.did.map(esc).join(" ") : "Held."} ${L.fired.length ? "Orders: " + L.fired.map(esc).join(" ") : ""}
      → ${M.REGIMES[L.h2.r].name}, book <span class="${cls(L.ret)}">${pct(L.ret, 1)}</span>, decisions <b class="${cls(L.gain)}">${sfmt(L.gain)}</b>.</li>`).join("")}</ol></details></div>`;
  }

  const slots = names => names.map(n => `<div data-r="${n}"></div>`).join("");
  function renderPlay() {
    const root = $("#tab-play");
    if (!G) return;
    const over = G.t >= G.H;
    frame(root, over ? "over" : "turn", slots(["head", "supply"]) + (over
      ? `<div class="grid"><div>${slots(["end"])}</div><div>${slots(["chart", "holdings"])}</div></div>`
      : `${slots(["situation"])}<div class="grid"><div>${slots(["moves", "triggers", "plan"])}</div>
         <div>${slots(["chart", "risk", "tree", "log"])}<p class="note">Practice tool, not advice.</p></div></div>`));
    put(root, "head", `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0;border:0;padding:0">${over ? "Campaign complete" : `Turn ${G.t + 1} of ${G.H} · ${yearLabel(G.t)}`}</h2>
      <span class="note">Seed ${G.seed} · <a href="#" id="restart">new campaign</a></span></div>`);
    put(root, "supply", supplyHTML());
    put(root, "chart", chartHTML());
    if (over) { put(root, "end", endHTML()); put(root, "holdings", holdingsHTML()); }
    else {
      put(root, "situation", situationHTML()); put(root, "plan", planHTML()); put(root, "moves", movesHTML()); put(root, "triggers", triggersHTML());
      put(root, "risk", riskHTML()); put(root, "tree", treeHTML()); put(root, "log", logHTML());
      flushWant(); drawPlanHist();
    }
    drawHist();
  }
  // One set of listeners for the whole tab (nothing is re-bound on render).
  (function bindPlay() {
    const root = $("#tab-play"), on = (e, sel) => e.target.closest && e.target.closest(sel);
    root.addEventListener("click", e => {
      let el;
      if ((el = on(e, ".pill[data-mv]"))) { const a = G.args[el.dataset.mv], v = el.dataset.v; a[el.dataset.k] = isNaN(+v) ? v : +v;
        if (el.dataset.k === "side" && v === "sell" && !M.heldValue(G.p, a.t)) a.t = biggestStock(G.p); }
      else if (on(e, ".opts")) return;
      else if ((el = on(e, ".move[data-mv]"))) { const id = el.dataset.mv;
        if (id === "HOLD") G.plan = new Set(["HOLD"]);
        else if (G.plan.has(id)) { G.plan.delete(id); if (!G.plan.size) G.plan.add("HOLD"); }
        else { for (const x of [...G.plan]) if (M.conflicts(x, id)) G.plan.delete(x); G.plan.add(id); } }
      else if ((el = on(e, ".move[data-tg]"))) { const id = el.dataset.tg; G.trig.has(id) ? G.trig.delete(id) : G.trig.add(id); }
      else if (on(e, "#commitBtn")) return commit();
      else if (on(e, "#supToggle")) SUPPLY_OPEN = !SUPPLY_OPEN;
      else if (on(e, "#restart")) { e.preventDefault(); return newGame(); }
      else if (on(e, "#replayBtn")) return newGame(G.seed);
      else if (on(e, "#newBtn")) return newGame();
      else if ((el = on(e, "#copyBtn"))) {
        const txt = `Wargame playbook (seed ${G.seed})\n` + G.log.map(L =>
          `${L.year}: ${L.did.join(" ") || "Held."}${L.fired.length ? " Orders: " + L.fired.join(" ") : ""} → ${M.REGIMES[L.h1.r].name} → ${M.REGIMES[L.h2.r].name}, book ${pct(L.ret, 1)}, vs holding ${sfmt(L.gain)}`).join("\n");
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => { el.textContent = "Copied"; }, () => {});
        return; }
      else return;
      renderPlay();
    });
    root.addEventListener("input", e => { if (e.target.id === "goalR") goalDrag(+e.target.value); });
    root.addEventListener("change", e => {
      if (e.target.id === "goalR") { S.goal = +e.target.value; saveS(); renderPlay(); }
      else if (e.target.classList.contains("optSel")) { G.args[e.target.dataset.mv].t = e.target.value; renderPlay(); }
    });
  })();

  // ---------- Strategy Lab ----------
  let LAB = null, labSel = "disciplined", labCmp = "hold";
  function runLab() {
    if (LAB) Sim.close(LAB.sid);
    const H = S.years * 2, p0 = M.initPortfolio(D, M.TK), n = S.labN;
    const L = LAB = { out: null, odds: null, v0: M.afterTax(p0, S), H, n, m: 0, running: true,
      sid: Sim.open({ p0, S, seed: 424242, n, H, startR: S.start === "auto" ? M.START_AUTO : M.RIDX[S.start], turnOffset: 0 }) };
    Sim.run(L.sid, Object.keys(M.POLICIES).map(k => ({ key: k, policy: k })), { partial: true, odds: true,
      prog: m => { if (LAB !== L) return; if (m.results) L.out = m.results; L.m = m.done; if (tab === "lab") renderLab(); },
      done: m => { if (LAB !== L) return; L.out = m.results; L.odds = m.odds; L.m = n; L.running = false; Sim.close(L.sid); if (tab === "lab") renderLab(); } });
    renderLab();
  }
  const labDiff = () => { const a = LAB.out[labSel].afters, b = LAB.out[labCmp].afters; return a.map((x, i) => x - b[i]); };
  function labHeadToHead() {
    const A = M.POLICIES[labSel].name, B = M.POLICIES[labCmp].name;
    const pick = `<label class="f" style="flex-direction:row;align-items:center;gap:8px">Compare with <select id="labCmp">${Object.keys(M.POLICIES)
      .map(k => `<option value="${k}" ${k === labCmp ? "selected" : ""}>${M.POLICIES[k].name}</option>`).join("")}</select></label>`;
    if (labSel === labCmp) return `<div class="card"><h2>Head to head</h2>${pick}<p class="note">Pick two different strategies.</p></div>`;
    const d = labDiff(), ds = Float64Array.from(d).sort(), n = d.length, hold = LAB.out.hold.afters;
    const cut = M.quant(hold, 0.1); let win = 0, tail = 0, tn = 0;
    for (let i = 0; i < n; i++) { if (d[i] > 1) win++; if (hold[i] <= cut) { tail += d[i]; tn++; } }
    return `<div class="card"><h2>Head to head · ${A} vs ${B}</h2>${pick}
      <div class="stats" style="margin-top:12px">
        <div class="stat"><div class="k">${A} ends ahead</div><div class="v">${pctU(win / n)}</div><div class="note">of the same futures</div></div>
        <div class="stat"><div class="k">Typical edge</div><div class="v">${money(M.quantS(ds, 0.5))}</div></div>
        <div class="stat"><div class="k">Bad / good case</div><div class="v" style="font-size:16px">${money(M.quantS(ds, 0.1))} / ${money(M.quantS(ds, 0.9))}</div></div>
        <div class="stat"><div class="k">Edge in the worst 10% of markets</div><div class="v">${money(tn ? tail / tn : 0)}</div><div class="note">when it matters most</div></div>
      </div><canvas id="labHist" style="margin-top:12px" aria-label="Distribution of the difference between the two strategies"></canvas>
      <p class="note">Each bar = share of futures by how far ${A} finishes ahead of (green) or behind (red) ${B}, after tax.</p></div>`;
  }
  function renderLab() {
    const root = $("#tab-lab");
    frame(root, "lab", slots(["head", "results", "chart", "h2h", "odds"]));
    const L = LAB, goal = L ? L.v0 * S.goal : 0;
    put(root, "head", `<div class="card"><h2>War room · strategy test</h2>
      <p class="note">Each strategy vs the same ${S.labN.toLocaleString()} futures, ${S.years} years. Runs in the background; results fill in as futures finish.</p>
      <div class="row"><label class="f">Futures<input id="lN" type="number" value="${S.labN}" step="500" min="200" max="20000"></label>
      <button class="primary" id="lGo" style="align-self:flex-end" ${L && L.running ? "disabled" : ""}>${L && L.running ? `Running… ${pctU(L.m / L.n)}` : "Run simulation"}</button></div></div>`);
    if (!L || !L.out) { put(root, "results", `<div class="card note">${L ? "Simulating…" : "Press Run. Results appear as they are computed."}</div>`);
      ["chart", "h2h", "odds"].forEach(k => put(root, k, "")); return; }
    const rows = Object.entries(L.out).sort((a, b) => b[1].d50 - a[1].d50).map(([k, r]) => `<tr data-k="${k}" class="pickrow ${k === labSel ? "on" : ""}">
      <td><b>${M.POLICIES[k].name}</b><div class="note" style="white-space:normal;max-width:340px">${M.POLICIES[k].desc}</div></td>
      <td><b class="${k === "hold" ? "muted" : tone(r.d50)}">${k === "hold" ? "baseline" : sfmt(r.d50)}</b></td>
      <td>${fmt(r.p10)}</td><td>${fmt(r.p50)}</td><td>${fmt(r.p90)}</td><td>${pctU(pGoal(r.afters, goal))}</td><td>${fmt(r.cvar)}</td><td>${pct(r.ddMed)}</td><td>${pctU(r.pDD20)}</td></tr>`).join("");
    put(root, "results", `<div class="card"><h2>Results · after-tax net worth in ${S.years} years <span class="muted">· today ${fmt(L.v0)}${L.running ? ` · ${L.m.toLocaleString()} of ${L.n.toLocaleString()} futures` : ""}</span></h2><div class="scroll"><table>
      <tr><th>Strategy</th><th>Typical<br>vs holding</th><th>Bad case</th><th>Typical</th><th>Good case</th><th>Hits goal<br>${S.goal.toFixed(2)}×</th><th>Worst 10%<br>average</th><th>Typical<br>worst drop</th><th>Chance of<br>20%+ drop</th></tr>${rows}</table></div>
      <p class="note">Click a row to chart it. Bad / good case = 10th / 90th percentile. Goal is set in Setup or on the Campaign tab.</p></div>`);
    put(root, "chart", `<div class="card"><h2>${M.POLICIES[labSel].name} · range of outcomes</h2><canvas id="labChart" aria-label="Percentile fan chart"></canvas>
      <div class="legend"><span><i class="band" style="background:var(--you)"></i>10–90% and 25–75% of futures</span><span><i style="background:var(--you)"></i>median</span>
      <span><i class="dash"></i>${M.POLICIES[labCmp].name} median</span></div></div>`);
    put(root, "h2h", labHeadToHead());
    const o = L.odds;
    put(root, "odds", o ? `<div class="card"><h2>How often things happen in these ${S.years}-year futures</h2><div class="stats">
        <div class="stat"><div class="k">At least one correction</div><div class="v">${pctU(o.regime.CORR)}</div></div>
        <div class="stat"><div class="k">Recession / bear market</div><div class="v">${pctU(o.regime.BEAR)}</div></div>
        <div class="stat"><div class="k">Stagflation spell</div><div class="v">${pctU(o.regime.STAG)}</div></div>
        <div class="stat"><div class="k">AI capex shakeout</div><div class="v">${pctU(o.event.capex)}</div></div>
        <div class="stat"><div class="k">Taiwan Strait crisis</div><div class="v">${pctU(o.event.taiwan)}</div></div>
        <div class="stat"><div class="k">Surprise $4k expense</div><div class="v">${pctU(o.event.expense)}</div></div>
      </div></div>` : "");
    drawLab();
  }
  function drawLab() {
    const L = LAB; if (!L || !L.out || !$("#labChart")) return;
    const r = L.out[labSel], h = L.out[labCmp], you = css("--you");
    lineChart($("#labChart"), { n: L.H + 1, xl: halfLabel, height: 260,
      marks: [{ v: L.v0 * S.goal, color: css("--brass"), label: `goal ${S.goal.toFixed(2)}×` }],
      bands: [{ x0: 0, data: r.band.map(b => [b[0], b[4]]), color: you, alpha: 0.13, label: "10–90%" }, { x0: 0, data: r.band.map(b => [b[1], b[3]]), color: you, alpha: 0.16, label: "25–75%" }],
      series: [...(labSel === labCmp ? [] : [{ data: h.band.map(b => b[2]), color: css("--shadow"), width: 1.5, dash: [5, 4], label: M.POLICIES[labCmp].name }]),
        { data: r.band.map(b => b[2]), color: you, width: 2.5, label: M.POLICIES[labSel].name }] });
    if ($("#labHist") && labSel !== labCmp) histChart($("#labHist"), { values: labDiff(), height: 130 });
  }
  (function bindLab() {
    const root = $("#tab-lab");
    root.addEventListener("click", e => {
      const tr = e.target.closest("tr[data-k]");
      if (tr) { labSel = tr.dataset.k; renderLab(); }
      else if (e.target.id === "lGo") { S.labN = Math.max(200, Math.min(20000, +$("#lN").value || 2000)); saveS(); runLab(); }
    });
    root.addEventListener("change", e => { if (e.target.id === "labCmp") { labCmp = e.target.value; renderLab(); } });
  })();

  // ---------- Setup ----------
  function renderSetup() {
    const f = (id, label, val, step, note) => `<label class="f">${label}<input id="${id}" type="number" step="${step}" value="${val}"><span class="note">${note}</span></label>`;
    $("#tab-setup").innerHTML = `<div class="card"><h2>Game settings</h2><div class="row" style="align-items:flex-start;gap:18px">
      <label class="f">Market<select id="sScn"><option value="random">Random future (Monte Carlo)</option>${Object.values(M.HISTORY).map(h => `<option value="${h.id}" ${S.scenario === h.id ? "selected" : ""}>Replay: ${h.name} (${h.cash.length / 2} years)</option>`).join("")}</select></label>
      <label class="f">Horizon<select id="sY"><option value="3" ${S.years == 3 ? "selected" : ""}>3 years (3 turns)</option><option value="5" ${S.years == 5 ? "selected" : ""}>5 years (5 turns)</option></select></label>
      <label class="f">Starting market<select id="sStart"><option value="auto">Auto: weighted read of today</option>${M.REGIMES.map(r => `<option value="${r.id}" ${S.start === r.id ? "selected" : ""}>${r.name}</option>`).join("")}</select>
        </label>
      ${f("sHair", "Valuation haircut (%/yr)", S.haircut * 100, 0.5, "For high valuations. 0 = history.")}
      ${f("sLt", "Capital-gains rate (%)", S.ltcg * 100, 1, "Federal LTCG + state.")}
      ${f("sOrd", "Ordinary rate (%)", S.ordinary * 100, 1, "For loss deductions.")}
      ${f("sRes", "Cash reserve to keep ($)", S.reserve, 1000, "Never spent.")}
      ${f("sMon", "Monthly savings ($)", S.monthly, 100, "Into main account.")}
      ${f("sCap", "Single-stock cap (% NW)", S.cap * 100, 1, "For Trim.")}
      ${f("sGoal", "Goal (× starting net worth)", S.goal, 0.05, "For the odds of reaching it.")}
      ${f("sPrev", "Futures per decision preview", S.previewN, 100, "More = steadier numbers.")}
      </div><div class="row" style="margin-top:14px"><button class="primary" id="sSave">Save &amp; start new game</button></div></div>
      <div class="card"><h2>Imported holdings</h2><div class="scroll"><table><tr><th>Ticker</th><th>Name</th><th>Accounts</th><th>Value</th><th>Beta</th><th>Tech load</th><th>Intl load</th><th>6-mo idio vol</th></tr>
      ${Object.values(M.TK).map(k => { const acc = D.accounts.filter(a => a.holdings.some(h => h.ticker === k.ticker));
        const v = acc.reduce((s, a) => s + a.holdings.filter(h => h.ticker === k.ticker).reduce((q, h) => q + h.shares * h.price, 0), 0);
        return `<tr><td><b>${k.ticker}</b></td><td>${esc(k.name)}</td><td>${acc.map(a => a.id).join(", ")}</td><td>${fmt(v)}</td><td>${k.beta.toFixed(2)}</td><td>${k.tech}</td><td>${k.intl}</td><td>${pct(k.idio)}</td></tr>`; }).join("")}
      </table></div>${D.demo ? "" : `<p class="note">Refresh: run <code>python3 build.py</code>, then reload.</p>`}</div>`;
    $("#sSave").onclick = () => {
      S.scenario = $("#sScn").value; S.years = +$("#sY").value; S.start = $("#sStart").value; S.haircut = (+$("#sHair").value || 0) / 100; S.ltcg = (+$("#sLt").value || 0) / 100;
      S.ordinary = (+$("#sOrd").value || 0) / 100; S.reserve = +$("#sRes").value || 0; S.monthly = +$("#sMon").value || 0; S.cap = (+$("#sCap").value || 5) / 100;
      S.goal = Math.max(1, Math.min(3, +$("#sGoal").value || 1.5));
      S.previewN = Math.max(100, Math.min(5000, +$("#sPrev").value || 800)); saveS(); if (LAB) Sim.close(LAB.sid); LAB = null; newGame();
      document.querySelector('nav button[data-tab="play"]').click();
    };
  }

  // ---------- Model tab ----------
  let CAL = null;
  function calibrate() {
    const rng = M.mulberry32(7), N = 4000, H = 10, S0 = Object.assign({}, S, { haircut: 0 });
    const pi = M.stationary();
    let anns = [], loss = 0, dd = 0, bear = 0;
    for (let i = 0; i < N; i++) {
      let s = M.pick(rng, pi), v = 1, pk = 1, md = 0, b = false, prev = 1;
      for (let t = 0; t < H; t++) { const d = M.drawTurn(rng, s, {}, S0); s = d.r; v *= 1 + d.mkt;
        pk = Math.max(pk, v); md = Math.min(md, v / pk - 1); b = b || s === M.RIDX.BEAR; if (t % 2) { anns.push(v / prev - 1); prev = v; } }
      loss += v < 1; dd += md < -0.2; bear += b;
    }
    const mean = anns.reduce((a, b) => a + b, 0) / anns.length, sd = Math.sqrt(anns.reduce((a, b) => a + (b - mean) ** 2, 0) / anns.length);
    CAL = { mean, sd, loss: loss / N, dd: dd / N, bear: bear / N, neg: anns.filter(x => x < 0).length / anns.length };
  }
  function renderModel() {
    if (!CAL) calibrate();
    const pi = M.stationary();
    $("#tab-model").innerHTML = `<div class="card"><h2>How it works</h2>
      <p>Six market states, switching every 6 months on historical odds. Each state drives the US market, tech and international; your holdings follow by beta, plus random shocks and event cards. Taxes tracked.</p>
      <p class="note">Reading the numbers: bad / typical / good case = 10th / 50th / 90th percentile of futures. Worst 10% average = mean after-tax net worth across the worst tenth of futures (CVaR).
      Worst drop = largest peak-to-trough fall in after-tax net worth, checked every 6 months. Every plan is scored on the same futures as holding, so the gap is the decision, not luck.</p>
      <h3>Check vs history</h3><div class="stats">
        <div class="stat"><div class="k">S&amp;P avg annual return</div><div class="v">${pct(CAL.mean, 1)}</div><div class="note">history ≈ +10–12% (arith.)</div></div>
        <div class="stat"><div class="k">Annual volatility</div><div class="v">${pct(CAL.sd, 1).replace("+", "")}</div><div class="note">history ≈ 16–19%</div></div>
        <div class="stat"><div class="k">Down years</div><div class="v">${Math.round(CAL.neg * 100)}%</div><div class="note">history ≈ 25–27%</div></div>
        <div class="stat"><div class="k">20%+ drawdown in 5 yrs</div><div class="v">${Math.round(CAL.dd * 100)}%</div><div class="note">history ≈ 40–55%</div></div>
        <div class="stat"><div class="k">5-yr span ends lower</div><div class="v">${Math.round(CAL.loss * 100)}%</div><div class="note">history ≈ 10–15%</div></div>
        <div class="stat"><div class="k">Bear/recession in 5 yrs</div><div class="v">${Math.round(CAL.bear * 100)}%</div><div class="note">US recession every ~6 yrs</div></div>
      </div><p class="note">Game uses a ${pct(S.haircut, 1)}/yr haircut for high valuations: about ${pct(CAL.mean - S.haircut, 1)}/yr.</p></div>
      <div class="card"><h2>Market states</h2><div class="scroll"><table><tr><th>State</th><th>US return / 6 mo</th><th>Vol / 6 mo</th><th>Tech factor</th><th>Intl vs US</th><th>Cash yield / yr</th><th>Long-run share of time</th></tr>
      ${M.REGIMES.map((r, i) => `<tr><td><span class="dot" style="background:${rcol(i)}"></span> <b>${r.name}</b></td><td>${pct(r.us[0], 1)}</td><td>${pct(r.us[1], 1).replace("+", "")}</td>
        <td>${pct(r.tech[0], 1)}</td><td>${pct(r.intl[0], 1)}</td><td>${pct(r.cash * 2, 1)}</td><td>${Math.round(pi[i] * 100)}%</td></tr>`).join("")}</table></div></div>
      <div class="card"><h2>Odds of the state one year from now</h2><div class="scroll"><table><tr><th>From \\ To</th>${M.REGIMES.map(r => `<th>${r.name.split(" ")[0]}</th>`).join("")}</tr>
      ${M.T2.map((row, i) => `<tr><td><b>${M.REGIMES[i].name}</b></td>${row.map((x, j) => `<td style="background:color-mix(in srgb, ${rcol(j)} ${Math.round(x * 70)}%, transparent)">${x >= 0.005 ? Math.round(x * 100) + "%" : "·"}</td>`).join("")}</tr>`).join("")}</table></div>
      <p class="note">Today's starting read (auto mode): ${M.START_AUTO.map((x, i) => x ? `${M.REGIMES[i].name} ${Math.round(x * 100)}%` : "").filter(Boolean).join(" · ")}.</p></div>
      <div class="card"><h2>Event cards</h2><div class="scroll"><table><tr><th>Event</th><th>Base chance / yr</th><th>Most likely in</th><th>What it does</th></tr>
      ${M.EVENTS.map(e => { const mx = Math.max(...e.m), most = e.m.map((x, i) => x === mx && mx > 1 ? M.REGIMES[i].name : null).filter(Boolean).join(", ") || "any";
        const fx = []; if (e.fx.us) fx.push(`US ${pct(e.fx.us)}`); if (e.fx.tech) fx.push(`tech ${pct(e.fx.tech)}`); if (e.fx.intl) fx.push(`intl ${pct(e.fx.intl)}`);
        if (e.fx.tk) for (const t in e.fx.tk) fx.push(`${t} ${pct(e.fx.tk[t])}`); if (e.fx.expense) fx.push(`−${fmt(e.fx.expense)} cash`);
        return `<tr><td><b>${e.title}</b></td><td>${Math.round((1 - (1 - e.p) ** 2) * 100)}%</td><td>${most}</td><td style="white-space:normal">${fx.join(", ")}</td></tr>`; }).join("")}</table></div>
      <p class="note">Event odds are judgment calls; edit in model.js.</p></div>
      <div class="card"><h2>Historical replay</h2><p>Setup → Market can swap the random future for real history: ${Object.values(M.HISTORY).map(h => esc(h.name)).join(", ")}. Each 6 months uses the actual S&amp;P 500 total return, Nasdaq Composite and MSCI EAFE returns, and Treasury-bill yields.</p>
      <p class="note">Your current holdings are run through those index returns by beta, tech load and international load. It is not each stock's own history; several did not exist then. The decision previews still use the Monte Carlo model, as you would not have known what came next.</p></div>
      <div class="card note"><b>Limits:</b> no wash-sale rules, all gains long-term, calibrated to history, not a forecast.</div>`;
  }

  function renderAll() { if (tab === "play") renderPlay(); else if (tab === "lab") renderLab(); else if (tab === "setup") renderSetup(); else renderModel(); }
  window.__wargame = { get G() { return G; }, get sim() { return Sim.mode; }, get lab() { return LAB; }, renderPlay }; // test hook
  let rz = 0; // redraw charts only, once the resize settles
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { hideTip(); if (tab === "play") { drawHist(); drawPlanHist(); } else if (tab === "lab") drawLab(); }, 120); });
  newGame();
})();

</script>
